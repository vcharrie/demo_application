apiVersion: apps/v1
kind: Deployment
metadata:
  name: coreservice
spec:
  template:
    spec:
      containers:
        - name: coreservice
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - wget -q --spider http://localhost:8080/actuator/health/readiness
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - wget -q --spider http://localhost:8080/actuator/health/liveness
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3