apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coreservice
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: coreservice.localdev.me
      http:
        paths:
          - path: /actuator/health
            pathType: Prefix
            backend:
              service:
                name: coreservice
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coreservice
                port:
                  number: 80