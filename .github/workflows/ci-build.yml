# CI/CD pipeline for the CoreService application.
# Builds the application, runs tests, packages a Docker image, and performs a basic deployment smoke test.
name: CI/CD - Build, Test, Package, Dockerize & Deploy

on:
  push:
    branches: [ "main", "v3_dev" ]
  pull_request:

jobs:

  # Build job: compiles the application, runs tests, builds a Docker image, and pushes it to GHCR.
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21 (Temurin distribution)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Step 3: Cache Maven dependencies to speed up subsequent builds
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Step 4: Build the application and run tests
      - name: Build with Maven
        run: mvn -DskipTests=false clean verify

      # Step 5: Upload Maven test reports as build artifacts
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: target/surefire-reports/

      # Step 6: Upload the built JAR for use in the deploy job
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: coreservice-jar
          path: target/*.jar

      # Step 7: Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # Step 8: Build the Docker image
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest .

      # Step 9: Push the Docker image to GHCR
      - name: Push Docker image
        run: docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest


  # Deploy job: pulls the image, runs it, and performs a smoke test.
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Authenticate to GHCR
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # Step 2: Pull the Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest

      # Step 3: Run the container in detached mode and wait for Spring Boot to start
      - name: Run container
        run: |
          docker run -d --name coreservice -p 8080:8080 ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest
          echo "Waiting for Spring Boot to start..."
          sleep 12

      # Step 4: Smoke test the health endpoint
      - name: Smoke test - health endpoint
        run: |
          echo "Running smoke test..."
          curl -f http://localhost:8080/actuator/health

      # Step 5: Stop the container (always executed)
      - name: Stop container
        if: always()
        run: docker stop coreservice

