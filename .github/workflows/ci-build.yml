# CI/CD pipeline for the CoreService application.
# Builds the application, runs tests, packages a Docker image, and performs a basic deployment smoke test.
name: CI/CD - Build, Test, Package, Dockerize & Deploy

on:
  push:
    branches: [ "main", "v3_dev", "feature/v3/issue-55-security-scans" ]
  pull_request:

jobs:

  # Build job: compiles the application, runs tests, builds a Docker image, and pushes it to GHCR.
  build:
    runs-on: ubuntu-latest
   
    env:
      IMAGE_NAME: coreservice
      REGISTRY: ghcr.io/${{ secrets.GHCR_USERNAME }}
      VERSION: ${{ github.ref_name || 'unknown' }}
      COMMIT_SHA: ${{ github.sha }}


    steps:

      # Step 1: Check out the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21 (Temurin distribution)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Step 3: Cache Maven dependencies to speed up subsequent builds
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Step 4: Build the application and run tests
      - name: Build with Maven
        run: mvn -DskipTests=false clean verify

# Temporarily disabled to allow build success the time Github Actions artifacts storage quota issue is resolved. Will re-enable once the issue is fixed.        
#      - name: Upload test reports
#        uses: actions/upload-artifact@v4
#        with:
#          name: maven-test-reports
#          path: target/surefire-reports/

#      - name: Upload Checkstyle report
#        uses: actions/upload-artifact@v4
#        with:
#          name: checkstyle-report
#          path: target/checkstyle-result.xml

#      - name: Upload PMD report
#        uses: actions/upload-artifact@v4
#        with:
#          name: pmd-report
#          path: target/pmd.xml
          
      # --- SpotBugs : génération du rapport ---
      - name: Run SpotBugs
        run: mvn -B spotbugs:spotbugs

        # --- SpotBugs : upload du rapport XML ---

#      - name: Upload SpotBugs report
#       uses: actions/upload-artifact@v4
#        with:
#            name: spotbugs-report
#            path: target/spotbugsXml.xml   

      - name: SonarCloud Scan
        run: mvn -B verify sonar:sonar
        env:
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

#      - name: Upload built JAR
#        uses: actions/upload-artifact@v4
#        with:
#          name: coreservice-jar
#          path: target/*.jar

      # Step 7: Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Generate build date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Sanitize VERSION
        id: sanitize
        run: |
          CLEAN_VERSION=$(echo "${VERSION}" | tr '/' '-' | tr ' ' '-' )
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image (optimized)
        run: |
          docker build \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg VCS_REF="${COMMIT_SHA}" \
            --build-arg VERSION="${{ steps.sanitize.outputs.version }}" \
            -t ${REGISTRY}/${IMAGE_NAME}:latest \
            -t ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA} \
            -t ${REGISTRY}/${IMAGE_NAME}:${{ steps.sanitize.outputs.version }} \
            .

      - name: Push Docker images
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:latest
          docker push ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}
          docker push ${REGISTRY}/${IMAGE_NAME}:${{ steps.sanitize.outputs.version }}

      # Step 9: Scan the Docker image for vulnerabilities using Trivy, failing the build if any CRITICAL or HIGH severity issues are found.    
      - name: Trivy Image Scan (CRITICAL/HIGH gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}
          format: table
          exit-code: 1
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true    

      # Optional: Generate a full JSON report from Trivy for manual analysis, and print it to the console. This can be useful for debugging or for keeping a record of the scan results.                
      - name: Trivy Full JSON Report (for manual analysis)
        if: always()
        run: |
           trivy image \
           --format json \
           --vuln-type os,library \
           ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }} \
           > trivy-report.json

           echo "===== BEGIN TRIVY JSON REPORT ====="
           cat trivy-report.json
           echo "===== END TRIVY JSON REPORT ====="

      # Step 10: Extract the image digest after pushing, save it to a file, and optionally upload it as an artifact for use in later stages or workflows.         
      - name: Extract image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA})
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
      
      - name: Save digest to file
        run: echo "${{ steps.digest.outputs.digest }}" > digest.txt    
      
      #- name: Upload image digest
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: docker-image-digest
      #    path: digest.txt    


  # Deploy job: pulls the image, runs it, and performs a smoke test.
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Authenticate to GHCR
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # Step 2: Pull the Docker image
      - name: Pull Docker image
        run: docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest

      # Step 3: Run the container in detached mode and wait for Spring Boot to start
      - name: Run container
        run: |
          docker run -d --name coreservice -p 8080:8080 ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest
          echo "Waiting for Spring Boot to start..."
          sleep 12

      # Step 4: Smoke test the health endpoint
      - name: Smoke test - health endpoint
        run: |
          echo "Running smoke test..."
          curl -f http://localhost:8080/actuator/health

      # Step 5: Stop the container (always executed)
      - name: Stop container
        if: always()
        run: docker stop coreservice

