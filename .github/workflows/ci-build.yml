name: CI/CD - Build, Test, Package, Dockerize & Deploy

env:
  ARTIFACT_RETENTION_DAYS: 2

on:
  push:
    branches:
      - v3_dev  
  pull_request:

jobs:

  # ---------------------------------------------------------
  # 1. BUILD — Maven build + tests (pur, sans variables Docker)
  # ---------------------------------------------------------
  build:
    permissions:
     contents: read
     actions: read
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn clean test

      - name: Upload JUnit test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junit-tests
          path: target/surefire-reports
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}  


  # ---------------------------------------------------------
  # 2. SAST — SpotBugs + SonarCloud (pur, sans variables Docker)
  # ---------------------------------------------------------
  sast:
    permissions:
     contents: read
     actions: read

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21

      - name: Run SAST (Checkstyle + PMD + SpotBugs)
        run: mvn verify

      - name: SonarCloud Scan
        run: mvn -B verify sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload PMD report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}


  # ---------------------------------------------------------
  # 3. IMAGE BUILD — Docker build (variables Docker ici uniquement)
  # ---------------------------------------------------------
  image-build:
    permissions:
     contents: read
     actions: read
     packages: write
    
    runs-on: ubuntu-latest
    needs: sast

    env:
      IMAGE_NAME: coreservice
      VERSION: ${{ github.ref_name || 'unknown' }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Normalize registry owner (lowercase)
        run: echo "REGISTRY_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set REGISTRY
        run: echo "REGISTRY=ghcr.io/${REGISTRY_OWNER_LC}" >> $GITHUB_ENV        

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --build-arg VCS_REF="${COMMIT_SHA}" \
            --build-arg VERSION="${VERSION}" \
            -t ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}-unscanned \
            .
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${REGISTRY_OWNER_LC}" --password-stdin

      - name: Push image non validée
        run: docker push ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}-unscanned

  # ---------------------------------------------------------
  # JOB 2 — IMAGE SCAN — Trivy image
  # ---------------------------------------------------------
  image-scan:
    runs-on: ubuntu-latest
    needs: image-build
    permissions:
      contents: read
      packages: read

    env:
      IMAGE_NAME: coreservice
      VERSION: ${{ github.ref_name || 'unknown' }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Normalize registry owner (lowercase)
        run: echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set REGISTRY
        run: echo "REGISTRY=ghcr.io/${REGISTRY_OWNER}" >> $GITHUB_ENV

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Pull unscanned image
        run: docker pull ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}-unscanned  
    
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Trivy (APT secure repo)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Image Scan
        run: |
          trivy image \
            --format json \
            --output trivy-image-report.json \
            --exit-code 1 \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed=true \
            --ignorefile config/trivy/.trivyignore \
            $REGISTRY/$IMAGE_NAME:$COMMIT_SHA-unscanned

      - name: Hash Trivy image report
        run: sha256sum trivy-image-report.json > trivy-image-report.json.sha256

      - name: Upload Trivy image scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-image-report
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          path: |
            trivy-image-report.json
            trivy-image-report.json.sha256

  # ---------------------------------------------------------
  # 5. PUBLISH — push images (variables Docker ici uniquement)
  # ---------------------------------------------------------
  publish:
    permissions:
      contents: read
      packages: write
      actions: read

    runs-on: ubuntu-latest
    needs: image-scan

    env:
      IMAGE_NAME: coreservice
      VERSION: ${{ github.ref_name || 'unknown' }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Normalize registry owner (lowercase)
        run: echo "REGISTRY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set REGISTRY
        run: echo "REGISTRY=ghcr.io/${REGISTRY_OWNER}" >> $GITHUB_ENV

      - name: Pull image non validée
        run: docker pull ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}-unscanned

      - name: Re-tag en image validée
        run: |
          docker tag \
          ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}-unscanned \
          ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}


      - name: Push Docker images
        run: |
          docker push ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}

      - name: Capture image digest
        run: |
         IMAGE_REF=${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}
         IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE_REF})
         echo "digest=${IMAGE_DIGEST}" >> metadata.txt

      - name: Generate metadata
        run: |
         echo "sha=${GITHUB_SHA}" >> metadata.txt
         echo "run_id=${GITHUB_RUN_ID}" >> metadata.txt
         echo "date=$(date -u)" >> metadata.txt

      - name: Hash metadata
        run: |
         sha256sum metadata.txt > metadata.txt.sha256   

      - name: Upload metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
         name: build-metadata
         retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
         path: | 
           metadata.txt
           metadata.txt.sha256
         

  # ---------------------------------------------------------
  # 6. DEPLOY — smoke test (variables Docker ici uniquement)
  # ---------------------------------------------------------
  deploy:
    permissions:
      contents: read
      packages: read
      actions: read
    
    runs-on: ubuntu-latest
    needs: publish

    env:
      IMAGE_NAME: coreservice
      REGISTRY: ghcr.io/${{ secrets.GHCR_USERNAME }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Pull Docker image
        run: docker pull ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}

      - name: Run container
        run: |
          docker run -d --name coreservice -p 8080:8080 ${REGISTRY}/${IMAGE_NAME}:${COMMIT_SHA}
          sleep 12

      - name: Smoke test
        run: curl -f http://localhost:8080/actuator/health

      - name: Stop container
        if: always()
        run: docker stop coreservice
