name: CI/CD - Build, Test, Package, Dockerize & Deploy

on:
  push:
    branches: [ "main", "v3_dev" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -DskipTests=false clean verify

# Temporarily disabled to allow build success the time Github Actions artifacts storage quota issue is resolved. Will re-enable once the issue is fixed.        
#      - name: Upload test reports
#        uses: actions/upload-artifact@v4
#        with:
#          name: maven-test-reports
#          path: target/surefire-reports/

#      - name: Upload built JAR
#        uses: actions/upload-artifact@v4
#        with:
#          name: coreservice-jar
#          path: target/*.jar

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Pull Docker image
        run: docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest

      - name: Run container
        run: |
          docker run -d --name coreservice -p 8080:8080 ghcr.io/${{ secrets.GHCR_USERNAME }}/coreservice:latest
          echo "Waiting for Spring Boot to start..."
          sleep 12

      - name: Smoke test - health endpoint
        run: |
          echo "Running smoke test..."
          curl -f http://localhost:8080/actuator/health

      - name: Stop container
        if: always()
        run: docker stop coreservice
