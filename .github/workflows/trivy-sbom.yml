name: Trivy SBOM (CycloneDX)

on:
  push:
  pull_request:
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - "src/**"
      - ".github/workflows/trivy-sbom.yml"
      - "config/trivy/**"

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Install dependencies (no tests)
        run: mvn -B -q dependency:resolve dependency:resolve-plugins

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-cyclonedx
          path: sbom.cdx
