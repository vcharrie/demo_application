name: Trivy SBOM (CycloneDX)

env:
  ARTIFACT_RETENTION_DAYS: 2

on:
  push:
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - "src/**"
      - ".github/workflows/trivy-sbom.yml"
      - "config/trivy/**"

  pull_request:
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - "src/**"
      - ".github/workflows/trivy-sbom.yml"
      - "config/trivy/**"

jobs:

  sbom:
    name: Generate SBOM (Trivy CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
           distribution: temurin
           java-version: 21

      - name: Cache Maven
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Preload Maven dependencies
        run: mvn -B -q dependency:resolve dependency:resolve-plugins      

      - name: Generate SBOM (CycloneDX via Trivy)
        run: |
          trivy fs . \
            --format cyclonedx \
            --output sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}


  sca:
    name: Scan SBOM with Trivy (SCA)
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom-cyclonedx

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan SBOM (fail on HIGH/CRITICAL)
        run: |
          trivy sbom sbom.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-code 1 \
            --format json \
            > trivy-sbom-report.json

      - name: Upload Trivy SBOM scan report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-sbom-report
          path: trivy-sbom-report.json
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}