name: Debug GHCR Context

on:
  workflow_dispatch:

jobs:
  debug-ghcr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show GitHub context
        run: |
          echo "=== GitHub Context ==="
          echo "GITHUB_REPOSITORY_OWNER = $GITHUB_REPOSITORY_OWNER"
          echo "GITHUB_REPOSITORY       = $GITHUB_REPOSITORY"
          echo "GITHUB_ACTOR            = $GITHUB_ACTOR"
          echo "GITHUB_REF_NAME         = $GITHUB_REF_NAME"
          echo "GITHUB_SHA              = $GITHUB_SHA"

      - name: Show owner char by char
        run: |
          echo "=== Owner (char by char) ==="
          for (( i=0; i<${#GITHUB_REPOSITORY_OWNER}; i++ )); do
            echo " - ${GITHUB_REPOSITORY_OWNER:$i:1}"
          done

      - name: Show GHCR_USERNAME char by char
        run: |
          echo "=== GHCR_USERNAME (char by char) ==="
          USERNAME="${{ secrets.GHCR_USERNAME }}"
          for (( i=0; i<${#USERNAME}; i++ )); do
            echo " - ${USERNAME:$i:1}"
          done

      - name: Show GHCR_TOKEN (partial, char by char)
        run: |
          echo "=== GHCR_TOKEN (partial, char by char) ==="
          TOKEN="${{ secrets.GHCR_TOKEN }}"
          for (( i=0; i<20 && i<${#TOKEN}; i++ )); do
            echo " - ${TOKEN:$i:1}"
          done

      - name: Show computed registry
        run: |
          echo "REGISTRY = ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

      - name: Show image naming
        run: |
          echo "IMAGE_NAME = coreservice"
          echo "TAG        = ${GITHUB_SHA}-unscanned"
          echo "FULL IMAGE = ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coreservice:${GITHUB_SHA}-unscanned"
