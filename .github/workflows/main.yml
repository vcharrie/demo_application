name: Debug GHCR Context

on:
  workflow_dispatch:

jobs:
  debug-ghcr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show GitHub context
        run: |
          echo "=== GitHub Context ==="
          echo "GITHUB_REPOSITORY_OWNER = $GITHUB_REPOSITORY_OWNER"
          echo "GITHUB_REPOSITORY       = $GITHUB_REPOSITORY"
          echo "GITHUB_ACTOR            = $GITHUB_ACTOR"
          echo "GITHUB_REF_NAME         = $GITHUB_REF_NAME"
          echo "GITHUB_SHA              = $GITHUB_SHA"

      - name: Show GHCR login user (base64)
        run: |
          echo "REGISTRY_OWNER_LC (base64) = $(echo -n ${GITHUB_REPOSITORY_OWNER,,} | base64)"

      - name: Show GHCR_USERNAME (base64)
        run: |
          echo "GHCR_USERNAME (base64) = $(echo -n '${{ secrets.GHCR_USERNAME }}' | base64)"

      - name: Show GHCR_TOKEN (base64, partial)
        run: |
          echo "GHCR_TOKEN (base64, partial) = $(echo -n '${{ secrets.GHCR_TOKEN }}' | base64 | cut -c1-40)"

      - name: Show computed registry
        run: |
          echo "REGISTRY = ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

      - name: Show image naming
        run: |
          echo "IMAGE_NAME = coreservice"
          echo "TAG        = ${GITHUB_SHA}-unscanned"
          echo "FULL IMAGE = ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coreservice:${GITHUB_SHA}-unscanned"
